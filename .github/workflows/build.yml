name: Build Automation-Platform

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13        # Intel x86_64
            arch: x86_64
            artifact_name: Automation-Platform-x86_64
          - os: macos-14        # Apple Silicon ARM64
            arch: arm64
            artifact_name: Automation-Platform-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller Automation-Platform.spec

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la dist/
          echo ""
          echo "=== MacOS contents ==="
          ls -la dist/Automation-Platform.app/Contents/MacOS/
          echo ""
          echo "=== Architecture info ==="
          file dist/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Automation-Platform.app
          retention-days: 7

  create-universal:
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Automation-Platform-x86_64
          path: ./x86_64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Automation-Platform-arm64
          path: ./arm64

      - name: Verify downloaded artifacts
        run: |
          echo "=== x86_64 artifact ==="
          ls -la ./x86_64/
          echo ""
          echo "=== arm64 artifact ==="
          ls -la ./arm64/

      - name: Create universal app
        run: |
          # 创建通用应用程序目录结构
          mkdir -p ./universal/Automation-Platform.app/Contents/{MacOS,Resources}
          
          # 复制 Info.plist 和资源文件（从任意一个架构）
          cp -r ./x86_64/Automation-Platform.app/Contents/Info.plist ./universal/Automation-Platform.app/Contents/
          cp -r ./x86_64/Automation-Platform.app/Contents/Resources/* ./universal/Automation-Platform.app/Contents/Resources/ 2>/dev/null || true
          
          # 使用 lipo 创建通用二进制
          echo "Creating universal binary..."
          lipo -create \
            ./x86_64/Automation-Platform.app/Contents/MacOS/Automation-Platform \
            ./arm64/Automation-Platform.app/Contents/MacOS/Automation-Platform \
            -output ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform
          
          # 设置可执行权限
          chmod +x ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Verify universal app
        run: |
          echo "=== Universal app structure ==="
          ls -la ./universal/Automation-Platform.app/Contents/MacOS/
          echo ""
          echo "=== Architecture info ==="
          file ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform
          echo ""
          echo "=== lipo info ==="
          lipo -info ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Platform-universal
          path: ./universal/Automation-Platform.app
          retention-days: 7
name: Build Automation-Platform

# 触发方式
#   1) 手动：Actions → Build Automation-Platform → Run workflow
#   2) 自动：推送 v* 标签（构建 universal 包并创建 Release）
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后创建 / 更新 GitHub Release（手动运行时标签用 build-<run_number>）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# 同一个 ref 只保留最新一次运行，新提交自动取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限，只有 release 作业单独申请 contents: write
permissions:
  contents: read

env:
  APP_NAME: Automation-Platform
  PYTHON_VERSION: '3.10'
  # 版本号来源：打 tag 触发时用 tag 名（v0.1.0 → 0.1.0，收敛逻辑在 Automation-Platform.spec 里），
  # 手动触发时为 0.0.0。会写入 app 的 CFBundleShortVersionString，并与 tag 做一致性校验。
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}

jobs:
  # ============================================================== 分架构构建
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64：Apple Silicon 镜像。
          # macos-14 已于 2026-07-06 进入弃用期（2026-11-02 停止支持），这里固定 macos-15。
          - arch: arm64
            runner: macos-15
            native_arch: arm64
          # x86_64：macos-13 已于 2025-12-04 彻底退役，Intel 的接替镜像是 macos-15-intel
          # （GitHub 官方文档中 Intel 标准镜像为 macos-15-intel / macos-26-intel，生命周期到 2027-08）。
          - arch: x86_64
            runner: macos-15-intel
            native_arch: x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 校验 runner 与 Python 架构
        run: |
          set -euo pipefail
          echo "runner : $(uname -m) / macOS $(sw_vers -productVersion)"
          python_arch="$(python -c 'import platform; print(platform.machine())')"
          echo "python : $(python --version) / $python_arch"
          if [ "$python_arch" != "${{ matrix.native_arch }}" ]; then
            echo "::error::期望 ${{ matrix.native_arch }} 架构的 Python，实际为 $python_arch"
            exit 1
          fi

      - name: 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: 依赖自检
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          import sys

          import numpy
          import PyQt6.QtCore
          import scipy
          import serial
          import ujson
          import zmq

          print('python :', sys.version.split()[0], platform.machine())
          print('PyQt6  :', PyQt6.QtCore.PYQT_VERSION_STR, 'Qt', PyQt6.QtCore.QT_VERSION_STR)
          print('serial :', serial.__version__)
          print('zmq    :', zmq.__version__)
          print('ujson  :', ujson.__version__)
          print('numpy  :', numpy.__version__)
          print('scipy  :', scipy.__version__)
          PY

      - name: 预检被 .gitignore 排除的运行时资源
        run: |
          # 这些路径在 .gitignore 里，CI 检出后不存在，但打包时会被一起复制进 app。
          # 缺失不阻断构建，只给明确告警，避免"CI 产物静默缺功能"。
          set -uo pipefail
          missing=0
          for p in plugins/libs/pty.py \
                   plugins/MIX_debug_plugin/mix/mix8_rpc_client.py; do
            if [ -e "$p" ]; then
              echo "OK       : $p"
            else
              echo "::warning::缺少 $p（被 .gitignore 排除，CI 产物可能缺少该功能，见仓库根 .gitignore）"
              missing=$((missing + 1))
            fi
          done
          echo "缺失项: $missing"

      - name: 编译原生 C 组件 fft_processor
        run: |
          set -euo pipefail
          cc -O2 -o plugins/Waveform_plugin/fft_processor C/fft_processor.c -lm
          echo "架构: $(lipo -archs plugins/Waveform_plugin/fft_processor)"
          # 冒烟测试：无参数时应打印用法，且不能是 "Bad CPU type" 之类的架构错误
          out="$(./plugins/Waveform_plugin/fft_processor 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "查询单频率" || {
            echo "::error::fft_processor 无法在本架构运行"; exit 1; }

      - name: PyInstaller 打包
        run: |
          set -euo pipefail
          pyinstaller --version
          pyinstaller --clean --noconfirm Automation-Platform.spec

      - name: 校验 app 包完整性
        run: |
          set -euo pipefail
          APP="dist/${APP_NAME}.app"
          BIN="$APP/Contents/MacOS/${APP_NAME}"
          test -f "$BIN" || { echo "::error::缺少主程序 $BIN"; exit 1; }
          archs="$(lipo -archs "$BIN")"
          echo "主程序架构: $archs"
          if [ "$archs" != "${{ matrix.native_arch }}" ]; then
            echo "::error::主程序架构不是 ${{ matrix.native_arch }}：$archs"
            exit 1
          fi
          # spec 的 post_build_copy_plugins 必须把 plugins 复制到 Contents/MacOS/
          test -d "$APP/Contents/MacOS/plugins" || {
            echo "::error::plugins 目录没有被复制进 app（检查 Automation-Platform.spec 的 post_build_copy_plugins）"
            exit 1; }
          # 随包分发的 C 组件必须保留可执行位
          test -x "$APP/Contents/MacOS/plugins/Waveform_plugin/fft_processor" || {
            echo "::error::app 内 fft_processor 不可执行"; exit 1; }

          # spec 是 onefile 打包（EXE 未设 exclude_binaries），Python/PyQt6/Qt 全部
          # 内嵌在主程序后缀的 CArchive 里，Contents/Frameworks 为空是正常现象。
          # 归档目录（TOC）以明文存放在二进制末尾，直接 grep 确认 Qt 确实进包了，
          # 防止在"没装 PyQt6 的环境"里打出启动即 ImportError 的空壳 app。
          for lib in "PyQt6/Qt6/lib/QtCore" "PyQt6/Qt6/lib/QtWidgets"; do
            grep -aq "$lib" "$BIN" || {
              echo "::error::app 内未找到 $lib —— PyQt6/Qt 没有被收集进包，启动会 ImportError"; exit 1; }
          done
          echo "PyQt6/Qt 已随包"

          echo "--- 版本 ---"
          ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "app 版本: $ver"
          echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || {
            echo "::error::Info.plist 里的版本号格式不合规：$ver"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            expected="${{ github.ref_name }}"; expected="${expected#v}"
            [ "$ver" = "$expected" ] || {
              echo "::error::app 版本 $ver 与 tag $expected 不一致"; exit 1; }
            echo "版本与 tag 一致"
          fi

          # spec 的 post_build_copy_plugins() 是在 PyInstaller 完成签名之后才把 plugins
          # 复制进来的，会让包的签名封印失效（codesign --verify 会报
          # "a sealed resource is missing or invalid"）。这里统一补做 ad-hoc 重签名，
          # 否则单架构产物本身就是坏的（Apple Silicon 上会被拒绝加载）。
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "ad-hoc 重签名校验通过"

          echo "--- app 内 plugins ---"
          ls -la "$APP/Contents/MacOS/plugins"
          du -sh "$APP"

      - name: 压缩（ditto 打包，保住可执行位）
        run: |
          # 不要用 upload-artifact 直接传 .app 目录：官方文档 "Permission Loss" 明确说明
          # 制品上传/下载后权限不保留（目录 755、文件 644），app 内的可执行文件会失去 +x。
          # 先用 ditto 打成 zip、下载后再 ditto -x 解开，即可保住权限。
          set -euo pipefail
          Z="dist/${APP_NAME}-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${APP_NAME}.app" "$Z"
          shasum -a 256 "$Z" | tee "$Z.sha256"
          ls -lh "$Z"

      - name: 上传 ${{ matrix.arch }} 产物
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.arch }}
          path: |
            dist/${{ env.APP_NAME }}-${{ matrix.arch }}.zip
            dist/${{ env.APP_NAME }}-${{ matrix.arch }}.zip.sha256
          retention-days: 14
          compression-level: 0

  # ========================================================= 合成 universal2
  universal:
    name: Create universal2 app
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 检出代码（重新编译 C 组件为 universal2 需要源码）
        uses: actions/checkout@v7

      - name: 下载 arm64 产物
        uses: actions/download-artifact@v8
        with:
          name: app-arm64
          path: artifacts/arm64

      - name: 下载 x86_64 产物
        uses: actions/download-artifact@v8
        with:
          name: app-x86_64
          path: artifacts/x86_64

      - name: 解压并校验两个单架构产物
        run: |
          set -euo pipefail
          for a in arm64 x86_64; do
            ditto -x -k "artifacts/$a/${APP_NAME}-$a.zip" "artifacts/$a/"
            BIN="artifacts/$a/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
            test -f "$BIN" || { echo "::error::$BIN 不存在"; exit 1; }
            archs="$(lipo -archs "$BIN")"
            echo "$a 主程序架构: $archs"
            [ "$archs" = "$a" ] || { echo "::error::$a 产物架构异常：$archs"; exit 1; }
            test -x "${BIN%/*}/plugins/Waveform_plugin/fft_processor" || {
              echo "::error::解压后 fft_processor 丢失可执行位（产物应通过 ditto 打包）"; exit 1; }
          done

      - name: 合成 universal2 app
        run: |
          set -euo pipefail
          ARM="artifacts/arm64/${APP_NAME}.app"
          X86="artifacts/x86_64/${APP_NAME}.app"
          APP="dist/${APP_NAME}.app"
          rm -rf dist
          mkdir -p dist
          # 以 arm64 包为骨架（Info.plist / Resources 两个包一致）
          cp -R "$ARM" "$APP"
          lipo -create \
            "$X86/Contents/MacOS/${APP_NAME}" \
            "$ARM/Contents/MacOS/${APP_NAME}" \
            -output "$APP/Contents/MacOS/${APP_NAME}"
          chmod +x "$APP/Contents/MacOS/${APP_NAME}"
          # 两个架构都能原生运行的 C 组件（不依赖 Rosetta）
          cc -O2 -arch x86_64 -arch arm64 \
             -o "$APP/Contents/MacOS/plugins/Waveform_plugin/fft_processor" \
             C/fft_processor.c -lm
          chmod +x "$APP/Contents/MacOS/plugins/Waveform_plugin/fft_processor"

      - name: 重签名并校验
        run: |
          # lipo 修改可执行文件后原签名失效，必须重新做 ad-hoc 签名，
          # 否则 Apple Silicon 内核会直接拒绝加载（"code signature invalid"）。
          set -euo pipefail
          APP="dist/${APP_NAME}.app"
          BIN="$APP/Contents/MacOS/${APP_NAME}"
          lipo -info "$BIN"
          archs="$(lipo -archs "$BIN")"
          echo "universal 主程序架构: $archs"
          if [ "$archs" != "x86_64 arm64" ] && [ "$archs" != "arm64 x86_64" ]; then
            echo "::error::主程序不是 universal2：$archs"; exit 1
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E '^(Executable|Identifier|Format|Signature|TeamIdentifier)' || true
          # 合包后同样确认 Qt 在包内（onefile 的归档目录在主程序二进制里，是明文）
          BIN="$APP/Contents/MacOS/${APP_NAME}"
          for lib in "PyQt6/Qt6/lib/QtCore" "PyQt6/Qt6/lib/QtWidgets"; do
            grep -aq "$lib" "$BIN" || {
              echo "::error::universal 包内未找到 $lib —— PyQt6/Qt 缺失"; exit 1; }
          done
          echo "PyQt6/Qt 已随包（universal）"
          # 版本号由两个架构的构建一致地带过来，这里再确认一遍没有在合包时丢失
          ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "universal 包版本: $ver"
          [ "$ver" = "${APP_VERSION#v}" ] || {
            echo "::error::universal 包版本 $ver 与期望 ${APP_VERSION#v} 不一致"; exit 1; }
          echo "--- app 内 C 组件 ---"
          file "$APP/Contents/MacOS/plugins/Waveform_plugin/fft_processor"
          out="$("$APP/Contents/MacOS/plugins/Waveform_plugin/fft_processor" 2>&1 || true)"
          echo "$out" | grep -q "查询单频率" || {
            echo "::error::universal 包内 fft_processor 无法运行"; exit 1; }

      - name: 压缩 universal 产物
        run: |
          set -euo pipefail
          Z="dist/${APP_NAME}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${APP_NAME}.app" "$Z"
          shasum -a 256 "$Z" | tee "$Z.sha256"
          du -sh "dist/${APP_NAME}.app"
          ls -lh "$Z"

      - name: 上传 universal 产物
        uses: actions/upload-artifact@v7
        with:
          name: app-universal
          path: |
            dist/${{ env.APP_NAME }}-universal.zip
            dist/${{ env.APP_NAME }}-universal.zip.sha256
          retention-days: 14
          compression-level: 0

  # ================================================================ 发布
  release:
    name: Publish release
    needs: universal
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载 universal 产物
        uses: actions/download-artifact@v8
        with:
          name: app-universal
          path: release

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本作业不 checkout，当前目录不是 git 仓库；gh 只认 GH_REPO/git remote，
          # 不会读 GITHUB_REPOSITORY，不设置就会 "could not determine base repo" 失败。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          ls -lh release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # tag 已随 push 存在时 target_commitish 会被 GitHub 忽略；
            # 手动触发时 tag 不存在，需要 --target 指定 commit。
            if ! out="$(gh release create "$TAG" --title "$TAG" --generate-notes \
                        --target "$GITHUB_SHA" 2>&1)"; then
              echo "$out"
              echo "::error::创建 Release 失败: $(echo "$out" | tail -n1)"
              exit 1
            fi
            echo "$out"
          fi
          if ! out="$(gh release upload "$TAG" release/*.zip release/*.sha256 --clobber 2>&1)"; then
            echo "$out"
            echo "::error::上传 Release 附件失败: $(echo "$out" | tail -n1)"
            exit 1
          fi
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

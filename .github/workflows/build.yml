name: Build Automation-Platform

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear cache
        run: |
          rm -rf ~/.cache/pip
          rm -rf ~/.pyenv

      - name: Set up Python (ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (ARM64)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ARM64 application
        run: |
          pyinstaller Automation-Platform.spec

      - name: Verify ARM64 build
        run: |
          echo "=== ARM64 Build output ==="
          ls -la dist/
          echo "=== MacOS folder ==="
          ls -la dist/Automation-Platform.app/Contents/MacOS/
          echo "=== Contents folder ==="
          ls -la dist/Automation-Platform.app/Contents/
          file dist/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Platform-arm64
          path: dist/Automation-Platform.app
          retention-days: 7

  build-x86_64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear cache
        run: |
          rm -rf ~/.cache/pip
          rm -rf ~/.pyenv

      - name: Set up Python (x86_64 via Rosetta)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (x86_64 via Rosetta)
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 pip install -r requirements.txt
          arch -x86_64 pip install pyinstaller

      - name: Build x86_64 application via Rosetta
        run: |
          arch -x86_64 pyinstaller Automation-Platform.spec

      - name: Verify x86_64 build
        run: |
          echo "=== x86_64 Build output ==="
          ls -la dist/
          echo "=== MacOS folder ==="
          ls -la dist/Automation-Platform.app/Contents/MacOS/
          echo "=== Contents folder ==="
          ls -la dist/Automation-Platform.app/Contents/
          file dist/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Platform-x86_64
          path: dist/Automation-Platform.app
          retention-days: 7

  create-universal:
    needs: [build-arm64, build-x86_64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Clear cache
        run: |
          rm -rf ~/.cache

      - name: Show current directory
        run: |
          echo "=== Current directory ==="
          pwd
          ls -la

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Automation-Platform-x86_64
          path: ./x86_64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Automation-Platform-arm64
          path: ./arm64

      - name: Verify downloaded artifacts
        run: |
          echo "=== x86_64 artifact content ==="
          find ./x86_64 -type f -name "*.plist" -o -name "Automation-Platform" 2>&1 || echo "No matching files found in x86_64"
          echo ""
          echo "=== arm64 artifact content ==="
          find ./arm64 -type f -name "*.plist" -o -name "Automation-Platform" 2>&1 || echo "No matching files found in arm64"

      - name: Create universal app
        run: |
          set -x
          
          mkdir -p ./universal/Automation-Platform.app/Contents/{MacOS,Resources}
          
          echo "=== Copying Info.plist from arm64 (preferred) ==="
          if [ -f "./arm64/Automation-Platform.app/Contents/Info.plist" ]; then
            cp ./arm64/Automation-Platform.app/Contents/Info.plist ./universal/Automation-Platform.app/Contents/
          elif [ -f "./x86_64/Automation-Platform.app/Contents/Info.plist" ]; then
            cp ./x86_64/Automation-Platform.app/Contents/Info.plist ./universal/Automation-Platform.app/Contents/
          else
            echo "ERROR: Info.plist not found in either artifact"
            exit 1
          fi
          
          echo "=== Copying Resources from arm64 ==="
          if [ -d "./arm64/Automation-Platform.app/Contents/Resources" ]; then
            cp -r ./arm64/Automation-Platform.app/Contents/Resources/* ./universal/Automation-Platform.app/Contents/Resources/ 2>/dev/null || true
          fi
          
          echo "=== Checking binary files ==="
          if [ ! -f "./x86_64/Automation-Platform.app/Contents/MacOS/Automation-Platform" ]; then
            echo "ERROR: x86_64 binary not found"
            exit 1
          fi
          if [ ! -f "./arm64/Automation-Platform.app/Contents/MacOS/Automation-Platform" ]; then
            echo "ERROR: arm64 binary not found"
            exit 1
          fi
          
          echo "=== Creating universal binary with lipo ==="
          lipo -create \
            ./x86_64/Automation-Platform.app/Contents/MacOS/Automation-Platform \
            ./arm64/Automation-Platform.app/Contents/MacOS/Automation-Platform \
            -output ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform
          
          echo "=== Setting permissions ==="
          chmod +x ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Verify universal app
        run: |
          echo "=== Universal app structure ==="
          ls -la ./universal/Automation-Platform.app/Contents/MacOS/
          echo ""
          echo "=== Architecture info ==="
          file ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform
          echo ""
          echo "=== lipo info ==="
          lipo -info ./universal/Automation-Platform.app/Contents/MacOS/Automation-Platform

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Platform-universal
          path: ./universal/Automation-Platform.app
          retention-days: 7